apiVersion: v1
kind: Namespace
metadata:
  name: autoref
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autoref-jobs
  namespace: autoref
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoref
  namespace: autoref
  labels:
    app: autoref
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 1m"
    keel.sh/match-tag: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: autoref
  template:
    metadata:
      labels:
        app: autoref
    spec:
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: autoref
          image: harbor.cortexbim.app/cortexbim-home/autoref:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AUTOREF_JOB_ROOT
              value: /app/data/jobs
            - name: AUTOREF_JOB_TTL_HOURS
              value: "24"
            - name: AUTOREF_CORS_ORIGINS
              value: https://autoref.cortexbim.app
          volumeMounts:
            - name: jobs
              mountPath: /app/data/jobs
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: jobs
          persistentVolumeClaim:
            claimName: autoref-jobs
---
apiVersion: v1
kind: Service
metadata:
  name: autoref
  namespace: autoref
  labels:
    app: autoref
spec:
  selector:
    app: autoref
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autoref
  namespace: autoref
  labels:
    app: autoref
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
spec:
  ingressClassName: nginx
  rules:
    - host: autoref.cortexbim.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: autoref
                port:
                  name: http
