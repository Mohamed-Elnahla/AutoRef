interface:
  display_name: "AutoRef DOCX"
  short_description: "Convert DOCX citations and figure/table cross-references"
  default_prompt: "Use $autoref-docx to convert my research paper's Zotero citations and figure/table cross-references."
dependencies:
  tools:
    - type: "mcp"
      value: "autoref"
      description: "AutoRef document analysis, citation and figure/table cross-reference conversion, artifact, and Zotero tools"
      transport: "stdio"
policy:
  allow_implicit_invocation: true
